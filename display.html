<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="status">Connecting</div>
  <div id="stage">
    <div id="messages"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const MAX_MESSAGES = 80;       // Browser holt maximal x Nachrichten höchstens
    const POLL_SECONDS = 15;       // Sicherheitsnetz: alle 15 s neu laden

    const list   = document.getElementById('messages');
    const status = document.getElementById('status');
    let realtimeOk = false;

    // IMMER die letzten 80 Nachrichten frisch aus der Datenbank und Liste komplett neu. Dadurch keine Doppelt-Anzeigen, und gelöschte Nachrichten verschwinden von selbst.
    async function load() {
      const { data, error } = await db
        .from('messages')
        .select('id, message, name, color')
        .order('id', { ascending: false })   // neueste zuerst holen ...
        .limit(MAX_MESSAGES);

      if (error) {
        console.error(error);
        status.textContent = 'Reconnecting';
        return;                              // alte Anzeige bleibt stehen
      }

      data.reverse();                        // ... dann für die Anzeige, älteste oben
      const items = data.map(row => {
       const p = document.createElement('p');
if (row.color && /^#[0-9a-fA-F]{6}$/.test(row.color)) p.style.color = row.color;
if (row.name) {
  const n = document.createElement('span');
  n.className = 'name';
  n.textContent = row.name;
  p.appendChild(n);
}
p.appendChild(document.createTextNode(row.message));
return p;

      });
      list.replaceChildren(...items);

      // Passt nicht alles auf den Bildschirm, die ältesten Nachrichten entfernen
      while (list.children.length > 1 && list.scrollHeight > list.clientHeight) {
        list.firstChild.remove();
      }

      status.textContent = realtimeOk ? 'Live' : 'Polling';
    }

    // Realtime : passiert irgendetwas an der Tabelle (neu, gelöscht, geändert), lädt neu (Klingel)
    db.channel('messages-feed')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, load)
      .subscribe(state => {
        realtimeOk = (state === 'SUBSCRIBED');
        if (realtimeOk) load();              // nach (Wieder-)Verbindung sofort aktualisieren
        else status.textContent = 'Reconnecting';
      });

    load();                                  // beim Öffnen laden
    setInterval(load, POLL_SECONDS * 1000);  // Sicherheitsnetz
  </script>
</body>
</html>
