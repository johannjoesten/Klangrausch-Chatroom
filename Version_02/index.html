<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klangrausch chatroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1>Klangrausch chatroom</h1>

    <!-- maxlength begrenzt die Eingabe auf 280 Zeichen -->
    <textarea id="input" maxlength="280"></textarea>
    <button id="send">Send</button>
    <div id="feedback"></div>
  </div>

  <!-- Reihenfolge wichtig: erst die Bibliothek, dann config.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const input    = document.getElementById('input');
    const sendBtn  = document.getElementById('send');
    const feedback = document.getElementById('feedback');

    sendBtn.addEventListener('click', async () => {
      const text = input.value.trim();            // Leerzeichen am Rand entfernen
      if (text.length === 0) return;              // leere Nachricht: nichts tun

      sendBtn.disabled = true;                    // Doppelklick verhindern
      sendBtn.textContent = 'Sending...';
      feedback.textContent = '';

      try {
        const { error } = await db.from('messages').insert({ message: text });
        if (error) throw error;
        input.value = '';                         // erst NACH Erfolg leeren
      } catch (err) {
        console.error(err);
        feedback.textContent = 'Could not send. Please try again.';
        // Text bleibt im Feld stehen, nichts geht verloren
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
