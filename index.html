<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klangrausch Chatroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1>Klangrausch Chatroom</h1>

    <!-- maxlength auf 280 Zeichen -->
    <input id="name" maxlength="24" placeholder="Name (optional)" autocomplete="off">
<div id="palette"></div>
<textarea id="input" maxlength="280"></textarea>
    <button id="send">Send</button>
    <div id="feedback"></div>
  </div>

  <!-- Reihenfolge wichtig, erst die Bibliothek, dann config.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script> 
  <script src="config.js"></script>
  <script>
    const input    = document.getElementById('input');
    const sendBtn  = document.getElementById('send');
    const feedback = document.getElementById('feedback');

    const COLORS = ['#ffffff', '#ff6b6b', '#ffa94d', '#ffe066',
                '#8ce99a', '#66d9e8', '#74a7ff', '#da77f2'];

const nameInput = document.getElementById('name');
const palette   = document.getElementById('palette');

function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key)          { try { return localStorage.getItem(key); } catch (e) { return null; } }

let selectedColor = COLORS.includes(recall('kr_color')) ? recall('kr_color') : COLORS[0];
nameInput.value = recall('kr_name') || '';

COLORS.forEach(color => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch' + (color === selectedColor ? ' selected' : '');
  b.style.background = color;
  b.setAttribute('aria-label', 'Color ' + color);
  b.addEventListener('click', () => {
    selectedColor = color;
    remember('kr_color', color);
    palette.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    b.classList.add('selected');
  });
  palette.appendChild(b);
});

    sendBtn.addEventListener('click', async () => {
      const text = input.value.trim();            // Leerzeichen am Rand entfernen
      if (text.length === 0) return;              // leere Nachricht, nix tun
      const name = nameInput.value.trim() || null;
remember('kr_name', nameInput.value.trim());

      sendBtn.disabled = true;                    // Doppelklick verhindern
      sendBtn.textContent = 'Sending...';
      feedback.textContent = '';

      try {
        const { error } = await db.from('messages')
  .insert({ message: text, name: name, color: selectedColor });
        if (error) throw error;
        input.value = '';                         // erst NACH Erfolg leeren
      } catch (err) {
        console.error(err);
        feedback.textContent = 'Could not send. Please try again.';
        // Text bleibt im Feld stehen, nichts geht verloren
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
